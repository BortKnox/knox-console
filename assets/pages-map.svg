<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Map of the 37 pages in seven groups">
  <defs>
    <style>
      text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .h { font-size: 13px; letter-spacing: 3px; font-weight: 700; fill: #80d7bd; }
      .c { font-size: 12px; letter-spacing: 2px; fill: #5f726a; text-anchor: end; }
      .p { font-size: 14px; fill: #c9d6d0; }
      .card { fill: #050807; stroke: #1c2a25; }
    </style>
  </defs>
  <rect width="1280" height="420" rx="16" fill="#000"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="16" fill="none" stroke="#1c2a25"/>

  <!-- row 1 -->
  <g>
    <rect class="card" x="24" y="24" width="296" height="176" rx="12"/>
    <text class="h" x="44" y="54">DAY + WORLD</text><text class="c" x="300" y="54">06</text>
    <text class="p" x="44" y="88">Home · Today · Focus</text><text class="p" x="44" y="112">Planner · World · News</text>

    <rect class="card" x="336" y="24" width="296" height="176" rx="12"/>
    <text class="h" x="356" y="54">AI</text><text class="c" x="612" y="54">04</text>
    <text class="p" x="356" y="88">AI · AI Pulse</text><text class="p" x="356" y="112">AI Quotas · AI Providers</text>

    <rect class="card" x="648" y="24" width="296" height="176" rx="12"/>
    <text class="h" x="668" y="54">REMOTE</text><text class="c" x="924" y="54">05</text>
    <text class="p" x="668" y="88">Remote · Media Remote</text><text class="p" x="668" y="112">Browser · Windows</text><text class="p" x="668" y="136">Keyboard</text>

    <rect class="card" x="960" y="24" width="296" height="176" rx="12"/>
    <text class="h" x="980" y="54">LAUNCH</text><text class="c" x="1236" y="54">07</text>
    <text class="p" x="980" y="88">Launchpad · Apps · Tools</text><text class="p" x="980" y="112">Media · Web</text><text class="p" x="980" y="136">Folders · Files</text>
  </g>
  <!-- row 2 -->
  <g>
    <rect class="card" x="24" y="220" width="408" height="176" rx="12"/>
    <text class="h" x="44" y="250">MEDIA + AUDIO</text><text class="c" x="412" y="250">06</text>
    <text class="p" x="44" y="284">Media · Music · Cinema</text><text class="p" x="44" y="308">Radio · Audio · Mic &amp; Live</text>

    <rect class="card" x="448" y="220" width="408" height="176" rx="12"/>
    <text class="h" x="468" y="250">SYSTEM</text><text class="c" x="836" y="250">06</text>
    <text class="p" x="468" y="284">Desk · System · Network</text><text class="p" x="468" y="308">Signals · Power · Routines</text>

    <rect class="card" x="872" y="220" width="384" height="176" rx="12"/>
    <text class="h" x="892" y="250">UNWIND</text><text class="c" x="1236" y="250">03</text>
    <text class="p" x="892" y="284">Calm · Sleep · Nightstand</text>
    <rect x="892" y="340" width="344" height="1" fill="#16231e"/>
    <text class="p" x="892" y="368" fill="#5f726a">Wind-down radio. Sleep timer.</text>
  </g>
</svg>
